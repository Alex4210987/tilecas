<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 554" role="img" aria-labelledby="title desc">
<title id="title">TileCas workflow</title><desc id="desc">The base agent plans, generates or edits, and evaluates candidates. TileCas links diagnosis, abstraction scheduling, and a retained search tree to select the next modification, source candidate, and abstraction level.</desc>
